name: Build

# - Every push to main: vet, test, build, and refresh the rolling "nightly"
#   pre-release with the new shunt.exe and portable zip.
# - Every pushed tag vX.Y.Z: the same build, published as release X.Y.Z with
#   that version's section of CHANGELOG.md as release notes.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Work out the version
        id: ver
        run: |
          base=$(sed -n 's/^var version = "\(.*\)"$/\1/p' cmd/shunt/main.go)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${base}-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Shunt $version"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Build shunt.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${{ steps.ver.outputs.version }}" -o dist/shunt.exe ./cmd/shunt

      - name: Package
        id: pkg
        run: |
          v="${{ steps.ver.outputs.version }}"
          cp third_party/wintun/amd64/wintun.dll dist/
          cp third_party/wintun/LICENSE.txt dist/wintun-LICENSE.txt
          cp README.md LICENSE CHANGELOG.md dist/
          zip="shunt-${v}-windows-amd64.zip"
          (cd dist && 7z a -tzip -bso0 "$zip" shunt.exe wintun.dll wintun-LICENSE.txt README.md LICENSE CHANGELOG.md)
          (cd dist && sha256sum shunt.exe "$zip" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "zip=dist/$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: shunt-${{ steps.ver.outputs.version }}-windows-amd64
          path: |
            dist/shunt.exe
            ${{ steps.pkg.outputs.zip }}
            dist/SHA256SUMS.txt

      - name: Publish nightly pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly build ${{ steps.ver.outputs.version }}" \
            --notes "Automatic build of the latest commit on main ($GITHUB_SHA). Not a stable release: use the latest versioned release unless you want to test new changes." \
            dist/shunt.exe "${{ steps.pkg.outputs.zip }}" dist/SHA256SUMS.txt

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          # Release notes: this version's section of CHANGELOG.md.
          awk -v ver="$v" '
            /^## / { if (found) exit; if (index($0, "[" ver "]") || index($0, " " ver)) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Shunt $v" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Shunt $v" \
            --notes-file notes.md \
            --latest \
            dist/shunt.exe "${{ steps.pkg.outputs.zip }}" dist/SHA256SUMS.txt
